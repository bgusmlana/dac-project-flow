# Production: jalankan dari folder deploy/
#   docker compose up -d --build
# Semua pengaturan rahasia ada di deploy/.env (salin dari .env.example).

name: manpro

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: mysql://manpro:${MYSQL_PASSWORD}@mysql:3306/manpro
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: https://${DOMAIN}
  WEB_ORIGIN: https://${DOMAIN}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
  STORAGE_DIR: /data/storage
  SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: manpro
      MYSQL_USER: manpro
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Jakarta
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=1G
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *app-env
      # Worker berjalan di container terpisah.
      RUN_WORKER: "false"
    volumes:
      - storage:/data/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
    volumes:
      - storage:/data/storage
    depends_on:
      - api

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  mysql-data:
  redis-data:
  storage:
  caddy-data:
  caddy-config:
